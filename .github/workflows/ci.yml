name: CI

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions for the workflow (least privilege)
permissions:
  contents: read

env:
  CI: true
  NODE_VERSION: '24.x'

jobs:
  # Detect whether this PR touches anything that can affect the app build/tests.
  # Filters live in .github/filters.yml (shared with e2e.yml).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      # Needed so paths-filter can read the shared filter file
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check for app-affecting changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: .github/filters.yml
          base: ${{ github.base_ref }}
          ref: ${{ github.head_ref }}

  # Lint, type-check, and unit tests run in parallel (no dependencies)
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint and formatting checks
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm lint

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types with TypeScript
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm type-check

  unit-tests:
    if: needs.changes.outputs.app == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # Required for uploading artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest unit tests with coverage
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm test:coverage

      - name: Upload test coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 7

  # Build depends on lint, types, and unit tests.
  # E2E tests run in e2e.yml against the Vercel deployment, not here.
  build:
    if: needs.changes.outputs.app == 'true'
    needs: [changes, lint, type-check, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        env:
          SKIP_ENV_VALIDATION: 'true'
          GITHUB_TOKEN: ${{ secrets.API_KEY }}
        run: pnpm build

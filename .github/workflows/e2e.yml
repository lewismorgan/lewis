name: E2E

# Runs the Playwright suite against real Vercel deployments:
# - Preview:    every successful preview deployment (one run per PR push)
# - Production: every successful production deployment, against the live domain
# - Monthly:    against the live domain, to catch GitHub API / token breakage
on:
  deployment_status:
  schedule:
    # 09:00 UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Deployment URL to test'
        required: false
        default: 'https://lewismorgan.dev'

permissions:
  contents: read

env:
  CI: true
  NODE_VERSION: '24.x'
  PRODUCTION_URL: 'https://lewismorgan.dev'

jobs:
  # Preview deployments only: skip e2e when the commit has no app changes vs main
  # (docs-only PRs). Filters are shared with ci.yml via .github/filters.yml.
  changes:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      !startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.app == 'true' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0

      - name: Check for app-affecting changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: .github/filters.yml
          base: main
          ref: ${{ github.event.deployment.sha }}

  e2e:
    needs: [changes]
    # deployment_status fires for pending/in_progress/failure too; only test finished deployments.
    # changes is skipped for production/schedule/dispatch, which always run.
    if: >-
      !cancelled() && needs.changes.result != 'failure' && (
        github.event_name != 'deployment_status' || (
          github.event.deployment_status.state == 'success' &&
          (needs.changes.result == 'skipped' || needs.changes.outputs.run == 'true')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: e2e-${{ github.event.deployment.environment || github.event_name }}-${{ github.event.deployment.sha || github.ref }}
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve test target
        id: target
        env:
          EVENT: ${{ github.event_name }}
          DEPLOY_ENV: ${{ github.event.deployment.environment }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "deployment_status" ]; then
            case "$DEPLOY_ENV" in
              Production*)
                # Test the live alias, not the per-deployment URL (which is protected)
                URL="$PRODUCTION_URL"; SHA="$DEPLOY_SHA" ;;
              *)
                URL="$DEPLOY_URL"; SHA="$DEPLOY_SHA" ;;
            esac
          else
            URL="${INPUT_URL:-$PRODUCTION_URL}"; SHA=""
          fi
          URL="${URL%/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "host=${URL#https://}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Testing $URL (expected sha: ${SHA:-ask Vercel})"

      # Ask Vercel which deployment the hostname currently serves. For production
      # deploys, wait until the alias points at this commit; otherwise read the sha.
      - name: Resolve deployed commit from Vercel
        id: vercel
        if: steps.target.outputs.url == env.PRODUCTION_URL || steps.target.outputs.sha == ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          HOST: ${{ steps.target.outputs.host }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          QUERY=""
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then QUERY="?teamId=$VERCEL_TEAM_ID"; fi
          API="https://api.vercel.com/v13/deployments/$HOST$QUERY"

          for attempt in $(seq 1 18); do
            BODY=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$API")
            LIVE_SHA=$(echo "$BODY" | jq -r '.meta.githubCommitSha // empty')
            STATE=$(echo "$BODY" | jq -r '.readyState // empty')
            echo "attempt $attempt: $HOST -> ${LIVE_SHA:-unknown} ($STATE)"

            if [ "$STATE" = "READY" ] && [ -n "$LIVE_SHA" ]; then
              if [ -z "$EXPECTED_SHA" ] || [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
                echo "sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done

          echo "::error::$HOST did not serve ${EXPECTED_SHA:-a READY deployment} within 3 minutes"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers with system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.url }}
          VERCEL_GIT_COMMIT_SHA: ${{ steps.vercel.outputs.sha || steps.target.outputs.sha }}
          # Only needed (and only sent) for protected, non-production URLs
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ steps.target.outputs.url != env.PRODUCTION_URL && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
        run: pnpm test:e2e

  # Track live-site failures in a single issue labelled e2e-prod
  report:
    needs: [e2e]
    if: >-
      always() && needs.e2e.result != 'skipped' && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.url == 'https://lewismorgan.dev') ||
        (github.event_name == 'deployment_status' && startsWith(github.event.deployment.environment, 'Production'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update, or close the e2e-prod issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.e2e.result }}
          SHA: ${{ needs.e2e.outputs.sha || github.event.deployment.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ISSUE=$(gh issue list --label e2e-prod --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ "$RESULT" = "success" ]; then
            if [ -n "$ISSUE" ]; then
              gh issue close "$ISSUE" --comment "Production e2e is green again (${SHA:-unknown sha}, $EVENT): $RUN_URL"
            fi
            exit 0
          fi

          BODY="Production e2e **$RESULT** on \`${SHA:-unknown sha}\` ($EVENT): $RUN_URL"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "Production e2e failing" --label e2e-prod --body "$BODY"
          fi

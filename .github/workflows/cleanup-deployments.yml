name: Mark Deployments Inactive

on:
  schedule:
    # Runs weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      debug:
        description: 'List changes only (no changes) when true'
        required: false
        default: 'true'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  mark-inactive:
    runs-on: ubuntu-latest
    name: Mark stale deployments as inactive
    env:
      DEBUG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      # Production: mark only deployments Vercel has deleted (URL 404/410); live ones stay active.
      # Preview: also mark anything older than 14 days. See the script header for the rules.
      - name: Mark stale deployments as inactive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/mark-stale-deployments.sh "Production:0" "Preview:14"

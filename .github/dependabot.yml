# Dependabot version updates: production dependencies only.
# Dev dependencies (tooling, types, test runners) get updated manually when work resumes.
# Security updates are enabled separately in the repo settings (Code security > Dependabot security updates).
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: 'monday'
      time: '08:00'
    allow:
      - dependency-type: 'production'
    groups:
      # Batch routine minor/patch bumps into one PR; majors stay separate for review
      production-minor-patch:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
    assignees:
      - lewismorgan
    reviewers:
      - lewismorgan
